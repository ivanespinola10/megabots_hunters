<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="110" fill="#0d0d0d"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16 8"/>
  
  <!-- Outer Mecha Head / Mask -->
  <polygon points="256,70 390,170 350,370 256,440 162,370 122,170" fill="#18181b" stroke="#06b6d4" stroke-width="12"/>
  
  <!-- Visor / Core Eye -->
  <polygon points="256,190 350,230 330,290 256,270 182,290 162,230" fill="#f59e0b" stroke="#fef08a" stroke-width="6"/>
  <line x1="162" y1="230" x2="350" y2="230" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Crest / Antenna -->
  <polygon points="256,50 280,120 232,120" fill="#f59e0b"/>
  <line x1="256" y1="40" x2="256" y2="90" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Jaw / Chin Plate -->
  <polygon points="220,380 292,380 276,420 236,420" fill="#ef4444"/>
  <line x1="256" y1="380" x2="256" y2="420" stroke="#0d0d0d" stroke-width="4"/>
  
  <!-- Core Glow -->
  <circle cx="256" cy="250" r="14" fill="#ffffff"/>
</svg>
